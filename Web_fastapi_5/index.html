<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyundai Solaris - Анализ цен</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 20px;
        }
        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        input, button {
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }
        input {
            flex: 1;
            min-width: 150px;
        }
        button {
            background-color: #4a6fa5;
            color: white;
            cursor: pointer;
            border: none;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #3a5a80;
        }
        .stats {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .stat-item {
            min-width: 200px;
        }
        .stat-value {
            font-weight: bold;
            font-size: 1.2em;
            color: #2c3e50;
        }
        .table-container {
            max-height: 600px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            position: sticky;
            top: 0;
            background-color: #4a6fa5;
            color: white;
            font-weight: normal;
        }
        tr:hover {
            background-color: #f0f4f8;
        }
        .price {
            text-align: right;
            white-space: nowrap;
            font-weight: bold;
            color: #2c3e50;
        }
        .car-title {
            font-weight: bold;
            margin-bottom: 4px;
        }
        .car-mileage {
            color: #666;
            font-size: 0.9em;
        }
        .car-year {
            display: inline-block;
            background: #e1e5eb;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.8em;
            margin-right: 5px;
        }
        .error {
            color: #d32f2f;
            background-color: #fde8e8;
            padding: 10px 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }
        .no-results {
            text-align: center;
            padding: 20px;
            color: #666;
            font-style: italic;
        }
        .registration-form {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .users-list {
            margin-top: 30px;
        }
        .users-list h2 {
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .user-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        #registerMessage {
            margin-top: 10px;
            padding: 10px;
            border-radius: 4px;
        }
        @media (max-width: 768px) {
            .filters {
                flex-direction: column;
            }
            input, button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>База данных Hyundai Solaris</h1>

        <!-- Форма регистрации -->
        <div class="registration-form">
            <h2>Регистрация</h2>
            <div class="form-group">
                <label for="name">Имя:</label>
                <input type="text" id="name" placeholder="Ваше имя">
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="Ваш email">
            </div>
            <button onclick="registerUser()">Зарегистрироваться</button>
            <div id="registerMessage"></div>
        </div>

        <div class="filters">
            <input type="number" id="year" placeholder="Год выпуска (напр. 2015)" min="2010">
            <input type="number" id="mileage" placeholder="Макс. пробег (напр. 100000)" min="0">
            <button onclick="loadCars()">Применить фильтры</button>
            <button onclick="resetFilters()">Сбросить</button>
        </div>

        <div id="error" class="error" style="display: none;"></div>

        <div class="stats">
            <div class="stat-item">
                <div>Найдено автомобилей:</div>
                <div class="stat-value" id="count">0</div>
            </div>
            <div class="stat-item">
                <div>Средняя цена:</div>
                <div class="stat-value" id="avgPrice">0 ₽</div>
            </div>
            <div class="stat-item">
                <div>Минимальная цена:</div>
                <div class="stat-value" id="minPrice">0 ₽</div>
            </div>
            <div class="stat-item">
                <div>Максимальная цена:</div>
                <div class="stat-value" id="maxPrice">0 ₽</div>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Автомобиль</th>
                        <th class="price">Цена</th>
                        <th>Дата добавления</th>
                    </tr>
                </thead>
                <tbody id="carsTable">
                    <tr>
                        <td colspan="4" class="no-results">Загрузка данных...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Список зарегистрированных пользователей -->
        <div class="users-list">
            <h2>Зарегистрированные пользователи</h2>
            <div id="usersList"></div>
        </div>
    </div>

    <script>
        // Функция загрузки автомобилей
        async function loadCars() {
            const year = document.getElementById('year').value;
            const mileage = document.getElementById('mileage').value;

            // Показываем индикатор загрузки
            document.getElementById('carsTable').innerHTML = `
                <tr>
                    <td colspan="4" class="no-results">Загрузка данных...</td>
                </tr>
            `;

            // Формируем URL с параметрами
            let url = '/api/cars?';
            if (year) url += `year=${encodeURIComponent(year)}&`;
            if (mileage) url += `mileage=${encodeURIComponent(mileage)}`;

            try {
                console.log('Отправка запроса:', url);
                const response = await fetch(url);

                if (!response.ok) {
                    const error = await response.json().catch(() => null);
                    throw new Error(error?.detail || `Ошибка сервера: ${response.status}`);
                }

                const cars = await response.json();
                console.log('Получены данные:', cars);

                if (cars.length === 0) {
                    document.getElementById('carsTable').innerHTML = `
                        <tr>
                            <td colspan="4" class="no-results">Автомобили не найдены по заданным критериям</td>
                        </tr>
                    `;
                } else {
                    renderCars(cars);
                }

                updateStats(cars);
                document.getElementById('error').style.display = 'none';
            } catch (error) {
                console.error('Ошибка:', error);
                document.getElementById('error').textContent = error.message;
                document.getElementById('error').style.display = 'block';

                document.getElementById('carsTable').innerHTML = `
                    <tr>
                        <td colspan="4" class="no-results">Ошибка при загрузке данных</td>
                    </tr>
                `;
            }
        }

        // Функция отображения автомобилей
        function renderCars(cars) {
            const tbody = document.getElementById('carsTable');
            tbody.innerHTML = '';

            cars.forEach(car => {
                // Извлекаем год из названия
                let year = '';
                try {
                    const yearPart = car.title.split(',')[1].trim();
                    year = yearPart.split(' ')[0];
                } catch (e) {
                    console.warn('Не удалось извлечь год для автомобиля ID:', car.id);
                }

                // Извлекаем пробег
                let mileage = 'не указан';
                try {
                    const mileagePart = car.title.split(',')[2].trim();
                    mileage = mileagePart.split(' км')[0] + ' км';
                } catch (e) {
                    console.warn('Не удалось извлечь пробег для автомобиля ID:', car.id);
                }

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${car.id}</td>
                    <td>
                        <div class="car-title">
                            ${year ? `<span class="car-year">${year}</span>` : ''}
                            ${car.title.split(',')[0].trim()}
                        </div>
                        <div class="car-mileage">
                            Пробег: ${mileage}
                        </div>
                    </td>
                    <td class="price">${formatPrice(car.price)}</td>
                    <td>${car.datetime.split(' ')[0]}</td>
                `;
                tbody.appendChild(row);
            });
        }

        // Функция обновления статистики
        function updateStats(cars) {
            const countElement = document.getElementById('count');
            const avgPriceElement = document.getElementById('avgPrice');
            const minPriceElement = document.getElementById('minPrice');
            const maxPriceElement = document.getElementById('maxPrice');

            countElement.textContent = cars.length.toLocaleString('ru-RU');

            if (cars.length === 0) {
                avgPriceElement.textContent = '0 ₽';
                minPriceElement.textContent = '0 ₽';
                maxPriceElement.textContent = '0 ₽';
                return;
            }

            // Фильтруем только автомобили с валидными ценами
            const validPrices = cars.filter(car => car.price > 0).map(car => car.price);

            if (validPrices.length > 0) {
                const avgPrice = Math.round(validPrices.reduce((sum, price) => sum + price, 0) / validPrices.length);
                const minPrice = Math.min(...validPrices);
                const maxPrice = Math.max(...validPrices);

                avgPriceElement.textContent = formatPrice(avgPrice);
                minPriceElement.textContent = formatPrice(minPrice);
                maxPriceElement.textContent = formatPrice(maxPrice);
            } else {
                avgPriceElement.textContent = '—';
                minPriceElement.textContent = '—';
                maxPriceElement.textContent = '—';
            }
        }

        // Функция сброса фильтров
        function resetFilters() {
            document.getElementById('year').value = '';
            document.getElementById('mileage').value = '';
            loadCars();
        }

        // Функция форматирования цены
        function formatPrice(price) {
            return new Intl.NumberFormat('ru-RU', {
                style: 'decimal',
                maximumFractionDigits: 0
            }).format(price) + ' ₽';
        }

        // Функция регистрации пользователя
        async function registerUser() {
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const messageEl = document.getElementById('registerMessage');

            if (!name || !email) {
                messageEl.textContent = 'Пожалуйста, заполните все поля';
                messageEl.style.color = 'red';
                return;
            }

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ name, email })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Ошибка регистрации');
                }

                const user = await response.json();
                messageEl.textContent = `Пользователь ${user.name} успешно зарегистрирован!`;
                messageEl.style.color = 'green';

                // Очищаем поля формы
                document.getElementById('name').value = '';
                document.getElementById('email').value = '';

                // Обновляем список пользователей
                loadUsers();
            } catch (error) {
                messageEl.textContent = error.message;
                messageEl.style.color = 'red';
                console.error('Registration error:', error);
            }
        }

        // Функция загрузки списка пользователей
        async function loadUsers() {
            try {
                const response = await fetch('/api/users');
                if (!response.ok) {
                    throw new Error('Ошибка загрузки пользователей');
                }

                const users = await response.json();
                const usersListEl = document.getElementById('usersList');

                if (users.length === 0) {
                    usersListEl.innerHTML = '<p>Нет зарегистрированных пользователей</p>';
                    return;
                }

                usersListEl.innerHTML = users.map(user => `
                    <div class="user-item">
                        <strong>${user.name}</strong> (${user.email})
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading users:', error);
                document.getElementById('usersList').innerHTML =
                    '<p style="color:red;">Ошибка загрузки пользователей</p>';
            }
        }

        // Загружаем данные при старте
        window.onload = function() {
            loadCars();
            loadUsers();

            // Автоматическая загрузка при изменении фильтров
            document.getElementById('year').addEventListener('change', loadCars);
            document.getElementById('mileage').addEventListener('change', loadCars);
        };
    </script>
</body>
</html>
